    <text x="500" y="150" opacity="0">M-Tech | Developer &amp; Creator<animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.04;0.22;0.26;0.5;0.75;0.9;1" dur="12s" repeatCount="indefinite"/></text>
