    <text x="500" y="150" opacity="0">Building things that matter<animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.58;0.62;0.72;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="500" y="150" opacity="0">Always learning, always shipping<animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.75;0.79;0.83;0.87;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>
